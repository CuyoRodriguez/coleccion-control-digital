<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc">
  <title id="title">Simulaci&#243;n y robot f&#237;sico son rutas distintas</title>
  <desc id="desc">Ejecutar solo muestra una simulaci&#243;n. El env&#237;o f&#237;sico exige la p&#225;gina local, Arduino, alimentaci&#243;n externa y confirmaci&#243;n. Detener no corta la alimentaci&#243;n.</desc>
  <rect width="1000" height="320" rx="16" fill="#131c2e"/>
  <g font-family="Segoe UI, sans-serif">
    <text x="24" y="35" fill="#f8fafc" font-size="21" font-weight="600">Dos rutas que no debes confundir</text>
    <rect x="24" y="56" width="952" height="80" rx="8" fill="#1b263b" stroke="#38bdf8"/>
    <g fill="#38bdf8" font-size="17" font-weight="600">
      <text x="44" y="87">SIMULACI&#211;N</text>
      <text x="310" y="87">Ejecutar / Pausa</text>
      <text x="660" y="87">Gr&#225;fica y modelo virtual</text>
    </g>
    <path d="M525 81H625L613 74 M625 81L613 88" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <text x="44" y="116" fill="#b6c2d4" font-size="14">No accede al puerto serial ni mide la posici&#243;n real de los servos.</text>
    <rect x="24" y="157" width="952" height="100" rx="8" fill="#1b263b" stroke="#fbbf24"/>
    <g fill="#fbbf24" font-size="17" font-weight="600">
      <text x="44" y="189">ROBOT F&#205;SICO</text>
      <text x="310" y="189">Verificar y confirmar</text>
      <text x="660" y="189">Enviar por USB local</text>
    </g>
    <path d="M525 183H625L613 176 M625 183L613 190" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <g fill="#b6c2d4" font-size="14">
      <text x="44" y="218">PC conectado al Arduino &#183; fuente externa de 5 V &#183; GND com&#250;n &#183; &#225;rea despejada.</text>
      <text x="44" y="242">El primer paquete v&#225;lido mueve el brazo a (90&#176;, 90&#176;). Solo se env&#237;an posicionamientos.</text>
    </g>
    <text x="24" y="294" fill="#f8fafc" font-size="15">Detener termina el env&#237;o, pero mantiene la &#250;ltima orden: no es un paro de emergencia.</text>
  </g>
</svg>
